name: Päivitä kilometridata

on:
  schedule:
    # Ajetaan joka yö klo 01:00 UTC (03:00–04:00 Suomen aikaa)
    - cron: '0 1 * * *'
  workflow_dispatch: # Mahdollistaa myös manuaalisen ajon

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Hae kilometridata
        run: python3 scripts/scrape.py

      - name: Committaa data.json jos muuttunut
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add KilometrikisaJannaksi/wwwroot/data.json
          git diff --staged --quiet || git commit -m "chore: päivitä kilometridata [skip ci]"
          git push
